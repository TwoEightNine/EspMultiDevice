enable_websocket_ping: true

server:
  websocket: wss://192-168-1-10.sslip.io:8443/xiaozhi/v1/
  auth:
    enabled: true
    allowed_devices: []
  mqtt_gateway: null
  mqtt_signature_key: null

prompt: |
  You are a calm, friendly voice assistant. Reply in Simplified Chinese when
  the user speaks Chinese, Russian when the user speaks Russian, and English
  for English or an unclear language. Keep the language chosen by the user.
  Speak naturally: prefer one or two short sentences for simple requests, but
  give clear, structured, and sufficiently detailed answers for complex
  questions or when the user asks to go deeper. Do not invent device actions.
  <memory></memory>
  For a request to play music from this device, use search_audio before
  play_audio. If search_audio returns several plausible matches, ask a short
  clarification. play_audio starts playback immediately, so do not speak a
  confirmation after calling it.
  For "play any song", call search_audio with query "*" and play the first
  returned selection without asking for clarification.
  Use get_time, get_wifi_status, get_wifi_signal, get_sd_status,
  get_mic_status, get_battery_status, get_volume, and get_led_status for facts
  about this device. Battery percentage is estimated from voltage; do not
  claim to know whether it is charging. Use set_volume and the two set_led
  tools only when requested, and report a failed setting accurately.
  For local images, videos, and ordinary files, search first and then use an
  opaque selection ID. Ask briefly when several matches are plausible.
  search_files returns both files and folders; show_file_info accepts files,
  and open_folder accepts folders. Never guess or invent a path.
  search_web opens DuckDuckGo Lite results in the device Browser. Send search
  words, never a URL. Opening a screen or starting playback is terminal, so
  do not speak a confirmation after a successful launch.

selected_module:
  VAD: SileroVAD
  ASR: OpenaiASR
  LLM: OpenAILLM
  TTS: AzureMultilingualTTS
  Intent: function_call
  Memory: mem_local_short

VAD:
  SileroVAD:
    type: silero
    threshold: 0.5
    threshold_low: 0.3
    model_dir: models/snakers4_silero-vad
    min_silence_duration_ms: 500

ASR:
  OpenaiASR:
    type: openai
    api_key: REPLACE_ONLY_IN_IGNORED_RUNTIME_CONFIG
    base_url: https://api.openai.com/v1/audio/transcriptions
    model_name: gpt-transcribe
    output_dir: tmp/

LLM:
  OpenAILLM:
    type: esp_media_openai_responses
    api_key: REPLACE_ONLY_IN_IGNORED_RUNTIME_CONFIG
    base_url: https://api.openai.com/v1
    model_name: gpt-5.6-luna
    reasoning_effort: medium

TTS:
  AzureMultilingualTTS:
    type: esp_media_azure_multilingual
    api_key: REPLACE_ONLY_IN_IGNORED_RUNTIME_CONFIG
    region: REPLACE_ONLY_IN_IGNORED_RUNTIME_CONFIG
    output_dir: tmp/
    fallback_locale: en-US
    output_format: audio-24khz-48kbitrate-mono-mp3
    voices:
      en-US: en-US-JennyMultilingualNeural
      zh-CN: zh-CN-XiaoxiaoMultilingualNeural
      ru-RU: ru-RU-SvetlanaNeural

Intent:
  function_call:
    type: function_call

Memory:
  mem_local_short:
    type: mem_local_short
    llm: OpenAILLM
