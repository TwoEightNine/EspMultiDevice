enable_websocket_ping: true

server:
  websocket: wss://192-168-1-10.sslip.io:8443/xiaozhi/v1/
  auth:
    enabled: true
    allowed_devices: []
  mqtt_gateway: null
  mqtt_signature_key: null

prompt: |
  You are a concise, friendly voice assistant. Reply in Simplified Chinese when
  the user speaks Chinese; otherwise reply in the same language as the user.
  Prefer one or two short sentences unless the user asks for more detail.
  For a request to play music from this device, use search_audio before
  play_audio. If search_audio returns several plausible matches, ask a short
  clarification. play_audio starts playback immediately, so do not speak a
  confirmation after calling it.
  For "play any song", call search_audio with query "*" and play the first
  returned selection without asking for clarification.

selected_module:
  VAD: SileroVAD
  ASR: OpenaiASR
  LLM: OpenAILLM
  TTS: EdgeTTS
  Intent: function_call
  Memory: mem_local_short

VAD:
  SileroVAD:
    type: silero
    threshold: 0.5
    threshold_low: 0.3
    model_dir: models/snakers4_silero-vad
    min_silence_duration_ms: 500

ASR:
  OpenaiASR:
    type: openai
    api_key: REPLACE_ONLY_IN_IGNORED_RUNTIME_CONFIG
    base_url: https://api.openai.com/v1/audio/transcriptions
    model_name: gpt-4o-mini-transcribe-2025-12-15
    output_dir: tmp/

LLM:
  OpenAILLM:
    type: openai
    api_key: REPLACE_ONLY_IN_IGNORED_RUNTIME_CONFIG
    base_url: https://api.openai.com/v1
    model_name: gpt-5.4-mini-2026-03-17

TTS:
  EdgeTTS:
    type: edge
    voice: zh-CN-XiaoxiaoNeural
    output_dir: tmp/
    language: 中文

Intent:
  function_call:
    type: function_call

Memory:
  mem_local_short:
    type: mem_local_short
    llm: OpenAILLM
